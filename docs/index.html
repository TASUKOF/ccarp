<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-P Trainer</title>
<style>
:root{
 --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2b313d;
 --tx:#e6e8ec; --dim:#9aa3b2; --ac:#d97757; --ok:#3fb950; --ng:#f85149; --wn:#d29922;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
 font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
 line-height:1.75;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:18px;margin:8px 0 2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.lbl{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-bottom:8px}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);
 border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;margin:0 4px 4px 0;
 transition:background .15s, border-color .15s; user-select:none}
.btn:hover{border-color:var(--ac)}
.btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;padding:9px 18px}
.btn.sec{background:transparent;border-color:var(--line);color:var(--dim)}
.btn.sec:hover{color:var(--tx);border-color:var(--dim)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.psetBtn{text-align:left;padding:12px;line-height:1.5}
.psetBtn b{display:block;font-size:14px;margin-bottom:2px}
.psetBtn span{font-size:11px;color:var(--dim)}
.bar{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--ac);transition:.2s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:10px}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;
 background:var(--card2);border:1px solid var(--line);color:var(--dim);margin-right:5px}
.tag.z{color:var(--ng);border-color:var(--ng)}
.tag.w{color:var(--wn);border-color:var(--wn)}

/* 上部クイック操作バー */
.quickNav{display:flex;justify-content:space-between;align-items:center;background:var(--card2);
 border:1px solid var(--line);padding:8px 12px;border-radius:8px;margin-bottom:12px}
.quickNav .qTitle{font-size:13px;font-weight:700;color:var(--dim)}

.qj{font-size:16px;font-weight:700;margin:10px 0 6px;line-height:1.7}
.qe{font-size:12px;color:var(--dim);font-style:italic;margin-bottom:14px;line-height:1.6}
.cue{font-size:11px;color:var(--ac);background:rgba(217,119,87,.08);
 border-left:2px solid var(--ac);padding:6px 10px;border-radius:0 6px 6px 0;margin-bottom:14px}
.ch{border:1px solid var(--line);background:var(--card2);border-radius:10px;
 padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;user-select:none}
.ch:hover{border-color:var(--ac)}
.ch.sel{border-color:var(--ac);background:rgba(217,119,87,.12)}
.ch.ok{border-color:var(--ok);background:rgba(63,185,80,.12)}
.ch.ng{border-color:var(--ng);background:rgba(248,81,73,.12)}
.ch .k{display:inline-block;width:20px;color:var(--dim);font-weight:700;font-size:13px}
.ch .e{display:block;font-size:11px;color:var(--dim);font-style:italic;margin-top:5px;line-height:1.5}
.res{padding:11px 14px;border-radius:9px;font-weight:700;font-size:14px;margin:14px 0}
.res.ok{background:rgba(63,185,80,.13);color:var(--ok)}
.res.ng{background:rgba(248,81,73,.13);color:var(--ng)}
.res.skip{background:var(--card2);color:var(--dim)}
.exp{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px}
.exp h4{margin:14px 0 5px;font-size:12px;color:var(--ac);letter-spacing:.05em}
.exp h4:first-child{margin-top:0}
.exp b{color:#fff}
.terms{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.t{display:inline-block;font-size:11px;padding:3px 9px;margin:0 5px 5px 0;border-radius:6px;
 background:rgba(217,119,87,.10);border:1px solid rgba(217,119,87,.35);color:var(--ac);cursor:pointer}
.tbody{display:none;background:var(--card);border:1px solid var(--line);
 border-radius:8px;padding:11px 13px;margin:5px 0 9px;font-size:13px}
.tbody.open{display:block}
.tbody .en{font-size:11px;color:var(--dim);margin-bottom:5px}

/* 下部固定ナビ */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.95);
 border-top:1px solid var(--line);padding:10px 16px;backdrop-filter:blur(10px);z-index:90}
.navin{max-width:860px;margin:0 auto;display:flex;gap:6px;align-items:center}
.navin .sp{flex:1}

/* 一覧モーダル */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);
 display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modalBox{background:var(--card);border:1px solid var(--line);border-radius:14px;
 width:100%;max-width:600px;max-height:85vh;display:flex;flex-direction:column;padding:18px}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modalBody{overflow-y:auto;padding-right:4px}
.qGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.qNumBtn{padding:8px 0;text-align:center;font-size:12px;font-weight:700;border-radius:7px;
 border:1px solid var(--line);background:var(--card2);color:var(--dim);cursor:pointer}
.qNumBtn.cur{border-color:var(--ac);outline:2px solid var(--ac);color:#fff}
.qNumBtn.ok{background:rgba(63,185,80,.15);border-color:var(--ok);color:var(--ok)}
.qNumBtn.ng{background:rgba(248,81,73,.15);border-color:var(--ng);color:var(--ng)}
.qNumBtn.read{background:rgba(217,119,87,.15);border-color:var(--ac);color:var(--ac)}

/* 汎用 */
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
.hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <h1>CCAR-P Trainer</h1>
  <div class="sub">75%以下の16領域・全51問</div>
  <div id="app"></div>
</div>
<div class="nav hide" id="nav"><div class="navin" id="navin"></div></div>

<!-- 問題ジャンプモーダル -->
<div class="modal hide" id="qModal" onclick="if(event.target===this)closeModal()">
  <div class="modalBox">
    <div class="modalHead">
      <b style="font-size:15px">問題リスト（スキップ・移動）</b>
      <button class="btn sec" style="margin:0;padding:4px 10px" onclick="closeModal()">✕ 閉じる</button>
    </div>
    <div class="modalBody">
      <div style="font-size:11px;color:var(--dim);margin-bottom:8px">
        🟩 正解 / 🟥 不正解 / 🟧 解説確認 / ⬜ 未着手 / [枠] 現在地
      </div>
      <div class="qGrid" id="qGrid"></div>
    </div>
  </div>
</div>

<script src="data/questions.js"></script>
<script>
var S={
  list:[],i:0,ans:{},done:{},mode:"practice",label:"",
  autoCheck:true // 1択問題で選んだら即採点・解説表示する
};
var KEY="ccarp_v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(h){localStorage.setItem(KEY,JSON.stringify(h))}
var H=load();
var $=function(id){return document.getElementById(id)};
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}

var PSET=[
 {k:"zero",n:"🔴 0% だけ",d:"22問 / 最優先。ここが合否を決める",f:function(q){return O[q.o].b===0}},
 {k:"weak",n:"🟠 苦手のみ (33-50%)",d:"19問 / 次点",f:function(q){var b=O[q.o].b;return b>0&&b<=50}},
 {k:"rev", n:"🟡 要復習 (67-75%)",d:"10問 / 軽く確認",f:function(q){return O[q.o].b>50}},
 {k:"all", n:"📘 全範囲",d:"51問 / 通し",f:function(q){return true}},
 {k:"miss",n:"🔁 誤答のみ",d:"間違えた問題だけ",f:function(q){return H[q.id]==="x"}}
];

function home(){
  $("nav").className="nav hide";
  closeModal();
  var t=0,c=0;for(var i=0;i<Q.length;i++){if(H[Q[i].id]){t++;if(H[Q[i].id]==="o")c++}}
  var h='<div class="card"><div class="lbl">出題範囲を選ぶ</div><div class="grid">';
  PSET.forEach(function(p){
    var n=Q.filter(p.f).length;
    h+='<button class="btn psetBtn" '+(n?'':'disabled ')+'onclick="pick(\''+p.k+'\')">'+
       '<b>'+p.n+'</b><span>'+p.d+' — '+n+'問</span></button>';
  });
  h+='</div></div>';
  h+='<div class="card"><div class="lbl">モード & オプション</div>'+
     '<button class="btn '+(S.mode==="practice"?"on":"")+'" onclick="setMode(\'practice\')">練習（即採点＋解説）</button>'+
     '<button class="btn '+(S.mode==="exam"?"on":"")+'" onclick="setMode(\'exam\')">本番風（後で一括採点）</button>'+
     '<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px">'+
       '<label style="cursor:pointer">'+
         '<input type="checkbox" '+(S.autoCheck?'checked':'')+' onchange="S.autoCheck=this.checked"> '+
         '<b>スピード回答モード</b>（1つ選択肢を押したら即判定＋解説）'+
       '</label>'+
     '</div>'+
     '</div>';
  if(t) h+='<div class="card"><div class="lbl">これまでの記録</div>'+
     '<div class="big">'+Math.round(c/t*100)+'%</div>'+
     '<div style="text-align:center;color:var(--dim);font-size:12px">'+c+' / '+t+' 問正解</div>'+
     '<div style="text-align:center;margin-top:12px"><button class="btn sec" onclick="reset()">記録を消去</button></div></div>';
  $("app").innerHTML=h;
}
function setMode(m){S.mode=m;home()}
function reset(){if(confirm("記録を消去しますか？")){H={};save(H);home()}}
function pick(k){
  var p=PSET.filter(function(x){return x.k===k})[0];
  S.list=Q.filter(p.f);S.label=p.n;S.i=0;S.ans={};S.done={};
  render();
}

function render(){
  var q=S.list[S.i],ob=O[q.o];
  var bc=ob.b===0?"z":(ob.b<=50?"w":"");
  var sel=S.ans[q.id]||[],fin=S.done[q.id];

  var h='<div class="card">';
  
  // 上部クイック操作バー（スクロールしなくても即スキップできる）
  h+='<div class="quickNav">'+
       '<span class="qTitle">'+(S.i+1)+' / '+S.list.length+' ('+q.id+')</span>'+
       '<div>'+
         '<button class="btn sec" style="padding:4px 8px" onclick="openModal()">📑 一覧</button>'+
         '<button class="btn '+(fin?"pri":"")+'" style="padding:4px 10px;margin-right:0" onclick="go(1)">'+
           (fin ? "次へ →" : "スキップ →")+
         '</button>'+
       '</div>'+
     '</div>';

  h+='<div class="bar"><i style="width:'+((S.i+1)/S.list.length*100)+'%"></i></div>';
  h+='<div style="margin-bottom:10px">'+
       '<span class="tag">'+ob.d+'</span><span class="tag '+bc+'">'+ob.ja+' '+ob.b+'%</span>'+
       '<span class="tag">'+(q.t==="m"?"2つ選択":"1つ選択")+'</span>'+
     '</div>';

  h+='<div class="qj">'+esc(q.qj)+'</div><div class="qe">'+esc(q.qe)+'</div>';
  if(q.cue) h+='<div class="cue">🔑 '+esc(q.cue)+'</div>';

  q.cj.forEach(function(c,n){
    var cls="ch";
    if(fin){ 
      if(q.a.indexOf(n)>=0) cls+=" ok"; 
      else if(sel.indexOf(n)>=0) cls+=" ng"; 
    } else if(sel.indexOf(n)>=0){
      cls+=" sel";
    }
    h+='<div class="'+cls+'" onclick="tap('+n+')">'+
       '<span class="k">'+"ABCD"[n]+'</span>'+esc(c)+
       '<span class="e">'+esc(q.ce[n])+'</span></div>';
  });

  if(fin){
    var isSkip=sel.length===0;
    var ok=!isSkip&&same(sel,q.a);
    h+='<div class="res '+(isSkip?"skip":ok?"ok":"ng")+'">'+
       (isSkip ? "― スキップ（解答確認）" : (ok?"✓ 正解":"✗ 不正解"))+
       '　正答: '+q.a.map(function(x){return "ABCD"[x]}).join(", ")+'</div>';
    h+='<div class="exp">'+q.e;
    if(q.tm&&q.tm.length){
      h+='<div class="terms"><div class="lbl">関連用語（タップで展開）</div>';
      q.tm.forEach(function(k){ if(!G[k])return;
        h+='<span class="t" onclick="tg(\''+k+'\')">'+G[k].ja+'</span>';});
      h+='<div style="margin-top:8px">';
      q.tm.forEach(function(k){ if(!G[k])return;
        h+='<div class="tbody" id="tb_'+k+'"><div class="en">'+esc(G[k].en)+'</div>'+G[k].d+'</div>';});
      h+='</div></div>';
    }
    h+='</div>';
  }
  h+='</div>';
  $("app").innerHTML=h;
  
  // 下部固定ナビバー
  $("nav").className="nav";
  var n='<button class="btn sec" onclick="home()">中断</button>';
  n+='<button class="btn" '+(S.i===0?'disabled ':'')+'onclick="go(-1)">← 前へ</button>';
  n+='<span class="sp"></span>';

  if(!fin){
    if(S.mode==="practice"){
      n+='<button class="btn sec" onclick="showAnswer()">答えだけ見る</button>';
    }
    if(sel.length>0){
      n+='<button class="btn pri" onclick="check()">解答する</button>';
    }
    n+='<button class="btn" onclick="go(1)">'+(S.i===S.list.length-1?'完了へ':'スキップ →')+'</button>';
  }else{
    n+='<button class="btn pri" onclick="go(1)">'+(S.i===S.list.length-1?"結果を見る":"次へ →")+'</button>';
  }
  $("navin").innerHTML=n;
}

function tg(k){var e=$("tb_"+k);e.className=e.className.indexOf("open")>=0?"tbody":"tbody open"}

function tap(n){
  var q=S.list[S.i];
  if(S.done[q.id])return;

  var a=S.ans[q.id]||[],p=a.indexOf(n);
  if(q.t==="m"){
    if(p>=0) a.splice(p,1);
    else{ if(a.length>=2)a.shift(); a.push(n); }
    S.ans[q.id]=a;
    render();
  }else{
    S.ans[q.id]=[n];
    if(S.autoCheck && S.mode==="practice"){
      check();
    }else{
      render();
    }
  }
}

function same(a,b){
  if(a.length!==b.length)return false;
  var x=a.slice().sort(),y=b.slice().sort();
  for(var i=0;i<x.length;i++)if(x[i]!==y[i])return false;
  return true;
}

function check(){
  var q=S.list[S.i],sel=S.ans[q.id]||[];
  if(q.t==="m"&&sel.length!==2){alert("2つ選択してください");return}
  var ok=same(sel,q.a);
  H[q.id]=ok?"o":"x";
  save(H);
  S.done[q.id]=1;
  if(S.mode==="exam"){
    go(1);
  }else{
    render();
  }
}

// 解答せずに正解・解説だけ確認する
function showAnswer(){
  var q=S.list[S.i];
  S.done[q.id]=1;
  render();
}

function go(d){
  var n=S.i+d;
  if(n>=S.list.length){result();return}
  if(n<0)return;
  S.i=n;
  render();
  window.scrollTo(0,0);
}

// モーダル操作
function openModal(){
  var h="";
  S.list.forEach(function(q,idx){
    var cls="qNumBtn";
    if(idx===S.i) cls+=" cur";
    if(S.done[q.id]){
      var sel=S.ans[q.id]||[];
      if(sel.length===0) cls+=" read";
      else if(same(sel,q.a)) cls+=" ok";
      else cls+=" ng";
    }
    h+='<button class="'+cls+'" onclick="jump('+idx+')">'+(idx+1)+'</button>';
  });
  $("qGrid").innerHTML=h;
  $("qModal").className="modal";
}
function closeModal(){$("qModal").className="modal hide"}
function jump(idx){
  closeModal();
  S.i=idx;
  render();
  window.scrollTo(0,0);
}

// PCキーボードショートカット
window.addEventListener("keydown",function(e){
  if(!$("qModal").classList.contains("hide")){
    if(e.key==="Escape") closeModal();
    return;
  }
  if($("nav").classList.contains("hide")) return;

  var key=e.key.toLowerCase();
  var q=S.list[S.i];
  if(!q) return;

  if(key==="1"||key==="a") tap(0);
  else if(key==="2"||key==="b") tap(1);
  else if(key==="3"||key==="c") tap(2);
  else if(key==="4"||key==="d") tap(3);
  else if(key==="arrowright"||key===" "){
    e.preventDefault();
    go(1); // 常に次へ/スキップ
  }
  else if(key==="arrowleft"){
    e.preventDefault();
    go(-1);
  }
  else if(key==="enter"){
    e.preventDefault();
    if(!S.done[q.id]){
      if(S.ans[q.id]&&S.ans[q.id].length) check();
      else showAnswer();
    }else{
      go(1);
    }
  }
});

function result(){
  $("nav").className="nav hide";
  closeModal();
  var c=0,by={};
  S.list.forEach(function(q){
    var ok=same(S.ans[q.id]||[],q.a); if(ok)c++;
    var k=O[q.o].ja; by[k]=by[k]||[0,0]; by[k][1]++; if(ok)by[k][0]++;
  });
  var pc=Math.round(c/S.list.length*100);
  var h='<div class="card"><div class="lbl">結果</div><div class="big" style="color:'+
    (pc>=80?"var(--ok)":pc>=60?"var(--wn)":"var(--ng)")+'">'+pc+'%</div>'+
    '<div style="text-align:center;color:var(--dim);font-size:12px">'+c+' / '+S.list.length+' 問正解</div>';
  h+='<div style="text-align:center;margin-top:8px;font-size:12px;color:var(--dim)">'+
     (pc>=80?"合格圏です。この調子で。":pc>=60?"もう一息。誤答のみを回してください。":"0%領域を精読しましょう。")+'</div></div>';
  h+='<div class="card"><div class="lbl">領域別</div><table>';
  Object.keys(by).sort(function(a,b){return by[a][0]/by[a][1]-by[b][0]/by[b][1]}).forEach(function(k){
    var r=Math.round(by[k][0]/by[k][1]*100);
    h+='<tr><td>'+k+'</td><td style="color:'+(r>=80?"var(--ok)":r>=50?"var(--wn)":"var(--ng)")+'">'+
       r+'% <span style="color:var(--dim)">('+by[k][0]+'/'+by[k][1]+')</span></td></tr>';
  });
  h+='</table></div>';
  h+='<div class="card"><button class="btn pri" onclick="pick(\'miss\')">誤答のみ復習</button>'+
     '<button class="btn" onclick="home()">ホームへ</button></div>';
  $("app").innerHTML=h;window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
