<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CCAR-P 弱点特化トレーナー</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f3;--pn:#fff;--ink:#1f1e1c;--i2:#55524d;--i3:#8b8781;--ln:#e6e3dd;--l2:#d4d0c8;--ac:#c96442;--acd:#a84f33;--acl:#fdf2ee;--ok:#2f7d5d;--okb:#eaf6f0;--ng:#b3352b;--ngb:#fdeeec;--wn:#9a6b12;--wnb:#fdf5e3;--r:10px;--rl:14px;--sh:0 1px 2px rgba(31,30,28,.05),0 2px 8px rgba(31,30,28,.04)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Inter','Noto Sans JP',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4,h5{margin:0;line-height:1.4;font-weight:700}
code{background:#f1efea;padding:1px 5px;border-radius:4px}
.hdr{position:sticky;top:0;z-index:50;background:rgba(247,246,243,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.hin{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--ac);display:grid;place-items:center;color:#fff;font-size:12px;font-style:normal}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--pn);border:1px solid var(--ln);font-size:12.5px;font-weight:600;color:var(--i2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.t{font-size:14px;font-weight:700;color:var(--ink)}
.chip.t.w{color:var(--ng);border-color:#f0c7c2;background:var(--ngb)}
.pb{height:3px;background:var(--ln)}.pb>div{height:100%;background:var(--ac);transition:width .3s}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 86px}.nr{max-width:820px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--rl);box-shadow:var(--sh)}
.pad{padding:26px 30px}
@media(max-width:640px){.pad{padding:20px 17px}.wrap{padding:16px 12px 76px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--r);font-weight:600;font-size:14.5px;background:var(--pn);border:1px solid var(--l2);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--i3);background:#fbfaf8}.btn:active{transform:translateY(1px)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:var(--acd)}
.btn.lg{padding:14px 30px;font-size:16px;width:100%}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn.fg.on{background:#fdf6e8;border-color:#e5cf9a;color:#b07d2a}
.hero{text-align:center;padding:6px 0 24px}.hero h1{font-size:29px;margin-bottom:10px}
.hero p{color:var(--i2);margin:0;font-size:14px}
@media(max-width:640px){.hero h1{font-size:22px}}
.sec{margin-bottom:24px}
.st{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--i3);margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.opt{display:block;padding:15px 17px;border:1.5px solid var(--ln);border-radius:var(--r);background:var(--pn);text-align:left;transition:.14s;width:100%}
.opt:hover{border-color:var(--i3)}.opt.on{border-color:var(--ac);background:var(--acl)}
.opt b{display:block;font-size:15px;margin-bottom:3px}.opt span{font-size:12.5px;color:var(--i2);line-height:1.6;display:block}
.pre{padding:8px 15px;border-radius:99px;border:1.5px solid var(--ln);background:var(--pn);font-size:13.5px;font-weight:600;margin:0 7px 7px 0;transition:.14s}
.pre:hover{border-color:var(--i3)}
.ob{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--ln);border-radius:9px;background:var(--pn);font-size:13.5px;width:100%;text-align:left;transition:.12s}
.ob:hover{background:#fbfaf8}.ob.on{border-color:var(--ac);background:var(--acl)}
.obc{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--l2);display:grid;place-items:center;flex:none;font-size:10px;color:#fff;background:#fff}
.ob.on .obc{background:var(--ac);border-color:var(--ac)}
.obn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obs{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;flex:none;font-variant-numeric:tabular-nums}
.s0{background:var(--ngb);color:var(--ng)}.s1{background:var(--wnb);color:var(--wn)}.s2{background:var(--okb);color:var(--ok)}
.obq{font-size:11.5px;color:var(--i3);flex:none}
.sl{display:flex;align-items:center;gap:14px}.sl input{flex:1;accent-color:var(--ac)}
.sl b{font-size:19px;min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--i3);margin-top:9px;line-height:1.7}
.qg{display:grid;grid-template-columns:1fr 224px;gap:20px;align-items:start}
@media(max-width:940px){.qg{grid-template-columns:1fr}.side{order:-1}}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:#f1efea;color:var(--i2)}
.tag.d{background:#eceffa;color:#3f4f8f}.tag.m{background:var(--wnb);color:var(--wn)}
.qno{font-size:13px;font-weight:700;color:var(--i3);font-variant-numeric:tabular-nums}
.qt{font-size:16.5px;line-height:1.85;font-weight:500}
.qt.en{font-size:15px;color:var(--i2);font-weight:400;padding-top:13px;margin-top:13px;border-top:1px dashed var(--l2)}
.mh{display:inline-block;margin-top:11px;font-size:13px;font-weight:600;color:var(--wn);background:var(--wnb);padding:5px 12px;border-radius:7px}
.chs{display:flex;flex-direction:column;gap:9px;margin-top:21px}
.ch{display:flex;gap:13px;padding:14px 16px;border:1.5px solid var(--ln);border-radius:var(--r);background:var(--pn);text-align:left;width:100%;align-items:flex-start;transition:.13s}
.ch:hover{border-color:var(--i3);background:#fbfaf8}.ch.on{border-color:var(--ac);background:var(--acl)}
.chk{width:25px;height:25px;border-radius:7px;border:1.5px solid var(--l2);flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--i2);background:#fff;margin-top:1px}
.ch.on .chk{background:var(--ac);border-color:var(--ac);color:#fff}
.chb{flex:1;min-width:0}.chja{line-height:1.7}
.chen{font-size:12.5px;color:var(--i3);line-height:1.65;margin-top:5px;font-style:italic}
.ch.ok{border-color:var(--ok);background:var(--okb)}.ch.ok .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ngb)}.ch.ng .chk{background:var(--ng);border-color:var(--ng);color:#fff}
.ch.dim{opacity:.5}.ch.lk{cursor:default}.ch.lk:hover{background:inherit}
.fb{margin-top:22px;border-radius:var(--rl);border:1px solid var(--ln);overflow:hidden}
.fbh{padding:13px 20px;font-weight:700;font-size:14.5px}
.fbh.ok{background:var(--okb);color:var(--ok)}.fbh.ng{background:var(--ngb);color:var(--ng)}
.fbb{padding:20px 22px}
.cue{background:#faf9f6;border:1px solid var(--ln);border-left:3px solid var(--ac);border-radius:8px;padding:11px 15px;margin-bottom:18px;font-size:13px;color:var(--i2)}
.cue b{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--i3);margin-bottom:4px}
.exp h4{font-size:13.5px;margin:19px 0 8px;color:var(--acd)}.exp h4:first-child{margin-top:0}
.exp p{margin:0 0 11px}.exp ul{margin:0 0 11px;padding-left:20px}.exp li{margin-bottom:5px}
.tms{display:flex;flex-wrap:wrap;gap:7px;margin-top:19px;padding-top:16px;border-top:1px solid var(--ln)}
.tm{padding:5px 12px;border-radius:99px;border:1px solid var(--l2);background:#faf9f6;font-size:12.5px;font-weight:600;color:var(--i2);transition:.12s}
.tm:hover{background:var(--acl);border-color:var(--ac);color:var(--acd)}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:13px}
@media(max-width:940px){.side{position:static}}
.sp2{background:var(--pn);border:1px solid var(--ln);border-radius:var(--rl);padding:15px;box-shadow:var(--sh)}
.sp2 h5{margin:0 0 11px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--i3)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(33px,1fr));gap:6px}
.nb{aspect-ratio:1;border-radius:7px;border:1.5px solid var(--ln);background:var(--pn);font-size:12px;font-weight:700;color:var(--i2);display:grid;place-items:center;position:relative;font-variant-numeric:tabular-nums;transition:.12s}
.nb:hover{border-color:var(--i3)}.nb.dn{background:#eceae5;border-color:var(--l2);color:var(--ink)}
.nb.cu{border-color:var(--ac);border-width:2px;background:var(--acl);color:var(--acd)}
.nb.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.nb.ng{background:var(--ngb);border-color:var(--ng);color:var(--ng)}
.nb.fl::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#b07d2a;border:1.5px solid #fff}
.leg{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;font-size:11px;color:var(--i3)}
.leg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;border:1px solid var(--l2)}
.ft{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:10px 20px calc(10px + env(safe-area-inset-bottom))}
.fti{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
@media(max-width:640px){.ft .lb{display:none}}
.sc{text-align:center;padding:32px 20px}
.sc .bg{font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sc .bg.p{color:var(--ok)}.sc .bg.f{color:var(--ng)}
.sc .vd{font-size:13.5px;font-weight:700;letter-spacing:.14em;margin-top:12px}
.sc .vd.p{color:var(--ok)}.sc .vd.f{color:var(--ng)}
.sc .sb{color:var(--i2);margin-top:9px;font-size:14px}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
@media(max-width:640px){.sts{grid-template-columns:repeat(2,1fr)}}
.s1x{background:#faf9f6;border:1px solid var(--ln);border-radius:var(--r);padding:14px;text-align:center}
.s1x b{display:block;font-size:23px;font-variant-numeric:tabular-nums}.s1x span{font-size:11.5px;color:var(--i3)}
.bd{border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.bdr{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--ln);font-size:13.5px}
.bdr:last-child{border:none}
.bdn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdb{width:100px;height:7px;border-radius:99px;background:var(--ln);overflow:hidden;flex:none}
@media(max-width:640px){.bdb{width:50px}}
.bdb>div{height:100%}
.bdv{width:50px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;flex:none;font-size:13px}
.dl{font-size:11.5px;font-weight:700;width:46px;text-align:right;flex:none}
.du{color:var(--ok)}.dd{color:var(--ng)}.de{color:var(--i3)}
.rv{border:1px solid var(--ln);border-radius:var(--r);padding:15px 17px;margin-bottom:11px}
.rvq{font-weight:500;line-height:1.7;margin:9px 0 11px}
.rva{font-size:13.5px;padding:7px 12px;border-radius:7px;margin-bottom:5px;line-height:1.6}
.rva.y{background:var(--okb);color:#1e5c42}.rva.n{background:var(--ngb);color:#8a281f}
.mask{position:fixed;inset:0;background:rgba(31,30,28,.45);z-index:100;display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}
.mo{background:var(--pn);border-radius:var(--rl);max-width:560px;width:100%;max-height:82vh;overflow:auto}
.moh{padding:19px 24px 0;display:flex;align-items:flex-start;gap:12px}.moh h3{flex:1;font-size:18px}
.mob{padding:14px 24px 24px}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--i3);font-size:19px;flex:none}
.x:hover{background:#f1efea}
.gen{font-size:12.5px;color:var(--i3);font-weight:600;margin-bottom:12px;font-style:italic}
.gd{line-height:1.9}
</style></head><body>
<div class="hdr"><div class="hin"><div class="logo"><i>C</i><span>CCAR-P Trainer</span></div><div class="sp"></div><div id="hi" style="display:flex;gap:8px"></div></div><div class="pb"><div id="pb" style="width:0%"></div></div></div>
<div id="app"></div>
<script src="data/questions.js"></script>
<script>
var DM={D1:"D1 Solution Design (17%)",D2:"D2 Models & Prompting (13%)",D3:"D3 Integration (19%)",D4:"D4 Eval & Testing (16%)",D5:"D5 Governance & Safety (14%)",D6:"D6 Stakeholder & Lifecycle (14%)",D7:"D7 Dev Productivity (7%)"};
var KEY="ABCDEFG", LS="ccarp_v1";
var S={scr:"start",mode:"practice",sel:null,count:20,qs:[],i:0,ans:{},chk:{},flag:{},t0:0,limit:0,tm:null,wrongOnly:false};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function eqa(a,b){if(a.length!==b.length)return false;for(var i=0;i<a.length;i++){if(b.indexOf(a[i])<0)return false}return true}
function scls(v){return v<=33?"s0":v<=70?"s1":"s2"}
function ld(){try{return JSON.parse(localStorage.getItem(LS))||{wrong:[],hist:[]}}catch(e){return{wrong:[],hist:[]}}}
function sv(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
function objKeys(){return Object.keys(window.O||{})}

function renderStart(){
  $("hi").innerHTML="";$("pb").style.width="0%";
  var bank=window.Q||[],O=window.O||{},cnt={},i;
  for(i=0;i<bank.length;i++){cnt[bank[i].o]=(cnt[bank[i].o]||0)+1}
  var w=ld();
  var keys=objKeys().sort(function(a,b){return O[a].b-O[b].b||a.localeCompare(b)});
  var obs=keys.map(function(k){
    return '<button class="ob '+(S.sel[k]?"on":"")+'" onclick="tog(\''+k+'\')"><span class="obc">✓</span><span class="obn">'+esc(O[k].ja)+'</span><span class="obq">'+(cnt[k]||0)+'問</span><span class="obs '+scls(O[k].b)+'">'+O[k].b+'%</span></button>'}).join("");
  var hist="";
  if(w.hist.length){hist='<div class="card pad" style="margin-top:16px"><div class="st">History</div>'+w.hist.slice(-5).reverse().map(function(h){return '<div style="display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:13.5px"><span style="color:var(--i3);flex:1">'+h.date+'</span><span style="color:var(--i3)">'+h.n+'問</span><b style="color:'+(h.pct>=75?"var(--ok)":"var(--ng)")+'">'+h.pct+'%</b></div>'}).join("")+'<button class="btn sm" style="margin-top:14px" onclick="rst()">記録をリセット</button></div>'}
  $("app").innerHTML='<div class="wrap nr"><div class="hero"><h1>CCAR-P 弱点特化トレーナー</h1><p>スコアレポート連動 · 全'+bank.length+'問 · 英日併記 · 用語解説付き</p></div>'+
  '<div class="card pad"><div class="sec"><div class="st">Mode / 出題モード</div><div class="g2">'+
  '<button class="opt '+(S.mode==="practice"?"on":"")+'" onclick="setM(\'practice\')"><b>練習モード</b><span>1問ごとに即・正誤と詳細解説。用語をタップすると意味が出ます。</span></button>'+
  '<button class="opt '+(S.mode==="exam"?"on":"")+'" onclick="setM(\'exam\')"><b>試験モード</b><span>1問1.9分のタイマー付き。解説は最後にまとめて。</span></button></div></div>'+
  '<div class="sec"><div class="st">Presets / 弱点プリセット</div><div>'+
  '<button class="pre" onclick="pst(0)">0% だけ</button><button class="pre" onclick="pst(33)">33%以下</button><button class="pre" onclick="pst(50)">50%以下</button><button class="pre" onclick="pst(100)">全範囲</button><button class="pre" onclick="pst(\'w\')">誤答のみ ('+w.wrong.length+')</button></div></div>'+
  '<div class="sec"><div class="st">Objectives / 出題範囲（数字は前回スコア）</div><div class="g2">'+obs+'</div></div>'+
  '<div class="sec"><div class="st">Length / 出題数</div><div class="sl"><input type="range" id="cnt" min="5" max="60" step="5" value="'+S.count+'" oninput="setC(this.value)"><b id="cv">'+S.count+'問</b></div><div class="note" id="av"></div></div>'+
  '<button class="btn p lg" onclick="start()">試験を開始する</button></div>'+hist+'</div>';
  upd();
}
function setM(m){S.mode=m;renderStart()}
function tog(k){S.sel[k]=!S.sel[k];S.wrongOnly=false;renderStart()}
function setC(v){S.count=+v;$("cv").textContent=v+"問";upd()}
function pst(v){S.wrongOnly=false;var O=window.O||{};var ks=objKeys();S.sel={};
  if(v==="w"){S.wrongOnly=true;ks.forEach(function(k){S.sel[k]=true})}
  else ks.forEach(function(k){S.sel[k]=O[k].b<=v});
  renderStart()}
function pool(){var bank=window.Q||[];if(S.wrongOnly){var w=ld().wrong;return bank.filter(function(q){return w.indexOf(q.id)>=0})}return bank.filter(function(q){return S.sel[q.o]})}
function upd(){var n=pool().length,el=$("av");if(!el)return;var u=Math.min(S.count,n);
  el.innerHTML=n===0?'<span style="color:var(--ng)">該当する問題がありません</span>':'該当 <b>'+n+'問</b> から <b>'+u+'問</b> を出題'+(S.mode==="exam"?' · 制限時間 <b>'+Math.round(u*1.9)+'分</b>':"")}

function start(){var p=pool();if(!p.length){alert("該当する問題がありません");return}
  S.qs=sh(p).slice(0,Math.min(S.count,p.length));S.i=0;S.ans={};S.chk={};S.flag={};S.scr="q";
  if(S.mode==="exam"){S.limit=Math.round(S.qs.length*1.9*60);S.t0=Date.now();clearInterval(S.tm);S.tm=setInterval(tick,1000)}
  window.scrollTo(0,0);renderQ()}
function tick(){var left=S.limit-Math.floor((Date.now()-S.t0)/1000);if(left<=0){clearInterval(S.tm);fin();return}
  var el=$("tmr");if(!el)return;el.textContent=("0"+Math.floor(left/60)).slice(-2)+":"+("0"+(left%60)).slice(-2);
  el.parentElement.className="chip t"+(left<300?" w":"")}

function renderQ(){
  var q=S.qs[S.i],n=S.qs.length,O=window.O||{},G=window.G||{};
  var done=Object.keys(S.ans).length;
  var lk=S.mode==="practice"&&S.chk[q.id];
  var sel=S.ans[q.id]||[];var ok=lk?eqa(sel,q.a):null;
  $("pb").style.width=((S.i+1)/n*100)+"%";
  $("hi").innerHTML=(S.mode==="exam"?'<span class="chip t"><span id="tmr">--:--</span></span>':"")+'<span class="chip">'+done+'/'+n+' 回答</span><button class="chip" onclick="quit()">中断</button>';
  if(S.mode==="exam")tick();
  var chs=q.cj.map(function(c,idx){var cls="ch";
    if(lk){cls+=" lk";if(q.a.indexOf(idx)>=0)cls+=" ok";else if(sel.indexOf(idx)>=0)cls+=" ng";else cls+=" dim"}
    else if(sel.indexOf(idx)>=0)cls+=" on";
    return '<button class="'+cls+'" '+(lk?"":'onclick="pick('+idx+')"')+'><span class="chk">'+KEY[idx]+'</span><span class="chb"><span class="chja">'+esc(c)+'</span><span class="chen">'+esc(q.ce[idx])+'</span></span></button>'}).join("");
  var fb="";
  if(lk){var tms=(q.tm||[]).map(function(t){return '<button class="tm" onclick="gl(\''+t+'\')">'+esc(G[t]?G[t].ja:t)+'</button>'}).join("");
    fb='<div class="fb"><div class="fbh '+(ok?"ok":"ng")+'">'+(ok?"✓ 正解":"✕ 不正解")+' — 正答: '+q.a.map(function(i){return KEY[i]}).join(", ")+'</div><div class="fbb"><div class="cue"><b>English cue</b>'+esc(q.cue)+'</div><div class="exp">'+q.e+'</div>'+(tms?'<div class="tms">'+tms+'</div>':"")+'</div></div>'}
  var nav=S.qs.map(function(x,idx){var c="nb";
    if(idx===S.i)c+=" cu";else if(S.mode==="practice"&&S.chk[x.id])c+=eqa(S.ans[x.id]||[],x.a)?" ok":" ng";else if(S.ans[x.id])c+=" dn";
    if(S.flag[x.id])c+=" fl";return '<button class="'+c+'" onclick="go('+idx+')">'+(idx+1)+'</button>'}).join("");
  $("app").innerHTML='<div class="wrap"><div class="qg"><div class="card pad">'+
  '<div class="qh"><span class="qno">Question '+(S.i+1)+' / '+n+'</span><span class="tag d">'+q.d+'</span><span class="tag">'+esc(O[q.o].ja)+'</span>'+(q.t==="m"?'<span class="tag m">複数選択</span>':"")+'<div style="flex:1"></div><button class="btn sm fg '+(S.flag[q.id]?"on":"")+'" onclick="fl()">⚑ <span class="lb">後で見直す</span></button></div>'+
  '<div class="qt">'+esc(q.qj)+'</div><div class="qt en">'+esc(q.qe)+'</div>'+(q.t==="m"?'<div class="mh">▸ 正解は '+q.a.length+' つです</div>':"")+
  '<div class="chs">'+chs+'</div>'+fb+'</div>'+
  '<div class="side"><div class="sp2"><h5>Navigator</h5><div class="nav">'+nav+'</div><div class="leg"><span><i style="background:var(--acl);border-color:var(--ac)"></i>現在</span><span><i style="background:#eceae5"></i>回答済</span><span><i style="background:#b07d2a;border-radius:50%"></i>見直し</span></div></div>'+
  '<div class="sp2"><h5>Info</h5><div style="font-size:12.5px;color:var(--i2);line-height:1.9">'+esc(DM[q.d])+'<br><span style="color:var(--i3)">前回スコア: </span><b class="obs '+scls(O[q.o].b)+'">'+O[q.o].b+'%</b></div></div></div></div></div>'+
  '<div class="ft"><div class="fti"><button class="btn" onclick="go('+(S.i-1)+')" '+(S.i===0?"disabled":"")+'>← <span class="lb">前へ</span></button><div class="sp"></div>'+
  (S.mode==="practice"&&!lk?'<button class="btn p" onclick="chk()" '+(sel.length?"":"disabled")+'>解答を確認</button>':(S.i<n-1?'<button class="btn p" onclick="go('+(S.i+1)+')"><span class="lb">次へ</span> →</button>':'<button class="btn p" onclick="fin()">採点する</button>'))+
  (S.mode==="exam"?'<button class="btn" onclick="fin()">終了</button>':"")+'</div></div>'}

function pick(idx){var q=S.qs[S.i],a=S.ans[q.id]||[];
  if(q.t==="m"){a=a.indexOf(idx)>=0?a.filter(function(x){return x!==idx}):a.concat([idx]).sort(function(x,y){return x-y})}else a=[idx];
  S.ans[q.id]=a;renderQ()}
function chk(){var q=S.qs[S.i];S.chk[q.id]=true;var d=ld();
  if(!eqa(S.ans[q.id]||[],q.a)){if(d.wrong.indexOf(q.id)<0)d.wrong.push(q.id)}else{d.wrong=d.wrong.filter(function(x){return x!==q.id})}
  sv(d);renderQ()}
function go(i){if(i<0||i>=S.qs.length)return;S.i=i;window.scrollTo(0,0);renderQ()}
function fl(){var id=S.qs[S.i].id;S.flag[id]=!S.flag[id];renderQ()}
function quit(){if(confirm("中断してトップに戻りますか？")){clearInterval(S.tm);S.scr="start";renderStart();window.scrollTo(0,0)}}

function fin(){clearInterval(S.tm);
  var un=S.qs.filter(function(q){return !S.ans[q.id]}).length;
  if(un>0&&!confirm("未回答が "+un+"問 あります。採点しますか？"))return;
  var d=ld();S.qs.forEach(function(q){var c=eqa(S.ans[q.id]||[],q.a);
    if(c)d.wrong=d.wrong.filter(function(x){return x!==q.id});else if(d.wrong.indexOf(q.id)<0)d.wrong.push(q.id)});
  var nOK=S.qs.filter(function(q){return eqa(S.ans[q.id]||[],q.a)}).length;
  var pct=Math.round(nOK/S.qs.length*100);
  d.hist.push({date:new Date().toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),n:S.qs.length,pct});
  sv(d);S.scr="r";window.scrollTo(0,0);res(nOK,pct)}

function res(nOK,pct){
  var n=S.qs.length,O=window.O||{},scaled=Math.round(pct*7.2+100),pass=pct>=75,by={};
  S.qs.forEach(function(q){if(!by[q.o])by[q.o]={o:0,n:0};by[q.o].n++;if(eqa(S.ans[q.id]||[],q.a))by[q.o].o++});
  var rows=Object.keys(by).sort(function(a,b){return by[a].o/by[a].n-by[b].o/by[b].n});
  var mins=S.mode==="exam"?Math.round((Date.now()-S.t0)/60000):null;
  $("hi").innerHTML='<button class="chip" onclick="home()">トップへ</button>';$("pb").style.width="100%";
  var bd=rows.map(function(k){var r=by[k],p=Math.round(r.o/r.n*100),dv=p-O[k].b;
    var col=p<=33?"var(--ng)":p<=70?"var(--wn)":"var(--ok)";var dc=dv>0?"du":dv<0?"dd":"de";
    return '<div class="bdr"><span class="tag d">'+O[k].d+'</span><span class="bdn">'+esc(O[k].ja)+'</span><span class="bdb"><div style="width:'+p+'%;background:'+col+'"></div></span><span class="bdv" style="color:'+col+'">'+p+'%</span><span class="dl '+dc+'">'+(dv>0?"▲+":dv<0?"▼":"±")+(dv===0?0:Math.abs(dv))+'</span></div>'}).join("");
  $("app").innerHTML='<div class="wrap nr"><div class="card"><div class="sc"><div class="bg '+(pass?"p":"f")+'">'+scaled+'</div><div class="vd '+(pass?"p":"f")+'">'+(pass?"PASS 相当":"FAIL 相当")+'</div><div class="sb">'+nOK+' / '+n+' 問正解（'+pct+'%）　※本番の合格基準は 720/900</div></div>'+
  '<div class="pad" style="padding-top:0"><div class="sts"><div class="s1x"><b style="color:var(--ok)">'+nOK+'</b><span>正解</span></div><div class="s1x"><b style="color:var(--ng)">'+(n-nOK)+'</b><span>不正解</span></div><div class="s1x"><b>'+pct+'%</b><span>正答率</span></div><div class="s1x"><b>'+(mins!==null?mins+"分":"—")+'</b><span>所要時間</span></div></div>'+
  '<div class="st" style="margin-top:26px">Objective 別スコア（右端は前回比）</div><div class="bd">'+bd+'</div>'+
  '<div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap"><button class="btn p" style="flex:1;min-width:150px" onclick="rev()">誤答を復習する ('+(n-nOK)+')</button><button class="btn" style="flex:1;min-width:150px" onclick="home()">トップへ戻る</button></div></div></div><div id="rb" style="margin-top:20px"></div></div>'}

function rev(){var O=window.O||{},G=window.G||{};
  var bad=S.qs.filter(function(q){return !eqa(S.ans[q.id]||[],q.a)});
  if(!bad.length){$("rb").innerHTML='<div class="card pad" style="text-align:center;color:var(--ok);font-weight:600">全問正解です 🎉</div>';return}
  $("rb").innerHTML='<div class="card pad"><div class="st">Review / 誤答の復習</div>'+bad.map(function(q){
    var sel=S.ans[q.id]||[];
    var tms=(q.tm||[]).map(function(t){return '<button class="tm" onclick="gl(\''+t+'\')">'+esc(G[t]?G[t].ja:t)+'</button>'}).join("");
    return '<div class="rv"><div class="qh"><span class="tag d">'+q.d+'</span><span class="tag">'+esc(O[q.o].ja)+'</span></div><div class="rvq">'+esc(q.qj)+'</div>'+
    '<div class="rva n">あなたの解答: '+(sel.length?sel.map(function(i){return KEY[i]+". "+esc(q.cj[i])}).join(" / "):"未回答")+'</div>'+
    '<div class="rva y">正解: '+q.a.map(function(i){return KEY[i]+". "+esc(q.cj[i])}).join(" / ")+'</div>'+
    '<div class="cue" style="margin-top:12px"><b>English cue</b>'+esc(q.cue)+'</div><div class="exp" style="font-size:14px">'+q.e+'</div>'+(tms?'<div class="tms">'+tms+'</div>':"")+'</div>'}).join("")+'</div>';
  $("rb").scrollIntoView({behavior:"smooth"})}

function home(){S.scr="start";window.scrollTo(0,0);renderStart()}
function rst(){if(confirm("学習記録を全て削除しますか？")){localStorage.removeItem(LS);renderStart()}}
function gl(k){var G=window.G||{},g=G[k];if(!g){alert("用語なし: "+k);return}
  var d=document.createElement("div");d.className="mask";
  d.onclick=function(e){if(e.target===d)d.remove()};
  d.innerHTML='<div class="mo"><div class="moh"><h3>'+esc(g.ja)+'</h3><button class="x" onclick="this.closest(\'.mask\').remove()">×</button></div><div class="mob"><div class="gen">'+esc(g.en)+'</div><div class="gd">'+g.d+'</div></div></div>';
  document.body.appendChild(d)}

document.addEventListener("keydown",function(e){
  if(S.scr!=="q"||e.metaKey||e.ctrlKey)return;var q=S.qs[S.i];if(!q)return;
  var idx=KEY.indexOf(e.key.toUpperCase());
  if(idx>=0&&idx<q.cj.length&&!(S.mode==="practice"&&S.chk[q.id])){e.preventDefault();pick(idx)}
  else if(e.key==="ArrowRight"){e.preventDefault();go(S.i+1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();go(S.i-1)}
  else if(e.key==="Enter"&&S.mode==="practice"&&!S.chk[q.id]&&(S.ans[q.id]||[]).length){e.preventDefault();chk()}});

(function boot(){
  if(!window.Q||!window.Q.length||!window.O){
    $("app").innerHTML='<div class="wrap nr"><div class="card pad" style="text-align:center"><h2 style="color:var(--ng);margin-bottom:12px">問題データが読み込めません</h2><p style="color:var(--i2);line-height:1.9"><code>docs/data/questions.js</code> がまだ作成されていません。<br>次の手順でファイルを作成してください。</p></div></div>';return}
  S.sel={};objKeys().forEach(function(k){S.sel[k]=true});
  renderStart()})();
</script>
</body></html>
